services:
  echo-speaks:
    build: .
    image: echo-speaks-nas:whispers-1.0.1-cookie-5.0.6
    container_name: echo-speaks
    restart: unless-stopped
    init: true
    ports:
      - "${NAS_IP}:8091:8091"
      - "${NAS_IP}:8092:8092"
    environment:
      PORT: "8091"
      PROXY_PORT: "8092"
      PROXY_OWN_IP: "${NAS_IP}"
      CONFIG_FILE: /data/config.json
      AMAZON_PAGE: amazon.com
      AMAZON_PAGE_PROXY_LANGUAGE: en_US
      ALEXA_SERVICE_HOST: pitangui.amazon.com
      TZ: America/Chicago
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
